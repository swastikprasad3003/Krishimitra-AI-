name: Deploy to GitHub Pages

on:
  push:
    branches: ['arena/79ac08d0-krishimitra-ai']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Self-enable the Pages site if it doesn't exist yet (GITHUB_TOKEN has pages:write).
  # Never fails the run: surfaces the API response as an annotation instead.
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Create or verify Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "Pages site already enabled."
            exit 0
          fi
          out=$(gh api "repos/$GITHUB_REPOSITORY/pages" -X POST -f build_type=workflow 2>&1)
          rc=$?
          echo "attempt1 rc=$rc :: $out"
          if [ $rc -ne 0 ]; then
            out2=$(gh api "repos/$GITHUB_REPOSITORY/pages" -X POST \
                   -f "source[branch]=$GITHUB_REF_NAME" -f "source[path]=/" 2>&1)
            rc2=$?
            echo "attempt2 rc=$rc2 :: $out2"
            if [ $rc2 -ne 0 ]; then
              echo "::error::PAGES_CREATE_FAILED:: $out | $out2"
            fi
          fi
          exit 0

  deploy:
    needs: [build, enable-pages]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages site state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          out=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>&1)
          echo "$out"
          echo "$out" | grep -q '"html_url"' || echo "::error::NO_PAGES_SITE:: $out"
          exit 0
      - id: deployment
        uses: actions/deploy-pages@v4
