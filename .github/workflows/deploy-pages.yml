name: Deploy to GitHub Pages

on:
  push:
    branches: ['arena/79ac08d0-krishimitra-ai']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Self-enable the Pages site if it doesn't exist yet (GITHUB_TOKEN has pages:write)
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Create or verify Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "Pages site already enabled."
          else
            gh api "repos/$GITHUB_REPOSITORY/pages" -X POST -f build_type=workflow \
              || gh api "repos/$GITHUB_REPOSITORY/pages" -X POST \
                   -f "source[branch]=$GITHUB_REF_NAME" -f "source[path]=/" -f build_type=workflow
            echo "Pages site created."
          fi

  deploy:
    needs: [build, enable-pages]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
